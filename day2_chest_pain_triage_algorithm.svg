<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
<defs><style>
.title{font:700 50px Arial,Helvetica,sans-serif;fill:#102033}
.sub{font:400 23px Arial,Helvetica,sans-serif;fill:#52677f}
.h{font:700 27px Arial,Helvetica,sans-serif;fill:#102033}
.p{font:400 20px Arial,Helvetica,sans-serif;fill:#243752}
.num{font:700 22px Arial,Helvetica,sans-serif;fill:white}
</style></defs>
<rect width="100%" height="100%" fill="#f7f9fc"/>
<rect x="40" y="35" width="1120" height="135" rx="28" fill="#eaf3ff"/>
<text x="70" y="96" class="title">Acute Chest Pain Triage</text>
<text x="70" y="138" class="sub">Rapid assessment and prioritization</text>
<rect x="140" y="220" width="920" height="180" rx="24" fill="#ffffff" stroke="#d8e4f4" stroke-width="2"/>
<circle cx="182" cy="262" r="25" fill="#1769e0"/>
<text x="182" y="270" text-anchor="middle" class="num">1</text>
<text x="222" y="270" class="h">Immediate assessment</text>
<text x="172" y="312" class="p">• ABCDE and vital signs</text>
<text x="172" y="350" class="p">• 12-lead ECG promptly if ACS is possible</text>
<text x="172" y="388" class="p">• Identify shock, hypoxemia or ongoing severe pain</text><line x1="600" y1="400" x2="600" y2="455" stroke="#7aa0c7" stroke-width="5"/><polygon points="590,437 610,437 600,455" fill="#7aa0c7"/><rect x="140" y="460" width="920" height="245" rx="24" fill="#fff7f7" stroke="#ffd7da" stroke-width="2"/>
<circle cx="182" cy="502" r="25" fill="#d9363e"/>
<text x="182" y="510" text-anchor="middle" class="num">2</text>
<text x="222" y="510" class="h">Look for time-critical causes</text>
<text x="172" y="552" class="p">• ACS</text>
<text x="172" y="590" class="p">• Aortic dissection</text>
<text x="172" y="628" class="p">• Pulmonary embolism</text>
<text x="172" y="666" class="p">• Tension pneumothorax or tamponade</text>
<text x="172" y="704" class="p">• Esophageal rupture</text><line x1="600" y1="705" x2="600" y2="760" stroke="#7aa0c7" stroke-width="5"/><polygon points="590,742 610,742 600,760" fill="#7aa0c7"/><rect x="140" y="765" width="920" height="205" rx="24" fill="#ffffff" stroke="#d8e4f4" stroke-width="2"/>
<circle cx="182" cy="807" r="25" fill="#1769e0"/>
<text x="182" y="815" text-anchor="middle" class="num">3</text>
<text x="222" y="815" class="h">Focused testing</text>
<text x="172" y="857" class="p">• Serial high-sensitivity troponin when appropriate</text>
<text x="172" y="895" class="p">• Repeat ECG if symptoms persist</text>
<text x="172" y="933" class="p">• Use CXR, CTA, echo or PE work-up according to the clinical</text>
<text x="172" y="963" class="p">  pattern</text><line x1="600" y1="970" x2="600" y2="1025" stroke="#7aa0c7" stroke-width="5"/><polygon points="590,1007 610,1007 600,1025" fill="#7aa0c7"/><rect x="140" y="1030" width="920" height="250" rx="24" fill="#f2fbf6" stroke="#d6efdf" stroke-width="2"/>
<circle cx="182" cy="1072" r="25" fill="#138a54"/>
<text x="182" y="1080" text-anchor="middle" class="num">4</text>
<text x="222" y="1080" class="h">Disposition</text>
<text x="172" y="1122" class="p">• STEMI → immediate reperfusion pathway</text>
<text x="172" y="1160" class="p">• High-risk NSTE-ACS → monitored admission and invasive</text>
<text x="172" y="1190" class="p">  strategy</text>
<text x="172" y="1228" class="p">• Alternative life-threatening diagnosis → treat cause</text>
<text x="172" y="1258" class="p">  urgently</text>
<text x="172" y="1296" class="p">• Low-risk pathway only after appropriate risk assessment</text><rect x="140" y="1325" width="920" height="225" rx="24" fill="#fff8e8" stroke="#ffe6b0" stroke-width="2"/>
<text x="168" y="1375" class="h">Clinical red flags</text>
<text x="172" y="1417" class="p">• Abrupt maximal pain with pulse or BP difference → consider</text>
<text x="172" y="1447" class="p">  dissection</text>
<text x="172" y="1485" class="p">• Pleuritic pain with VTE risk → consider pulmonary embolism</text>
<text x="172" y="1523" class="p">• Unilateral absent breath sounds with shock → treat tension</text>
<text x="172" y="1553" class="p">  pneumothorax</text>
<text x="172" y="1591" class="p">• A normal first ECG or troponin does not automatically</text>
<text x="172" y="1621" class="p">  exclude ACS</text>
</svg>