<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1380" viewBox="0 0 1200 1380">
<defs>
<style>
.title{font:700 54px Arial,Helvetica,sans-serif;fill:#102033}
.sub{font:400 24px Arial,Helvetica,sans-serif;fill:#52677f}
.h{font:700 28px Arial,Helvetica,sans-serif;fill:#102033}
.p{font:400 22px Arial,Helvetica,sans-serif;fill:#243752}
.small{font:400 18px Arial,Helvetica,sans-serif;fill:#52677f}
.num{font:700 24px Arial,Helvetica,sans-serif;fill:white}
</style>
</defs>
<rect width="100%" height="100%" fill="#f7f9fc"/>
<rect x="40" y="35" width="1120" height="135" rx="28" fill="#eaf3ff"/>
<text x="70" y="98" class="title">Acute Chest Pain Triage</text>
<text x="70" y="140" class="sub">Rapid assessment and prioritization</text>
<rect x="140" y="220" width="920" height="150" rx="24" fill="#ffffff" stroke="#d8e4f4" stroke-width="2"/>
<circle cx="182" cy="262" r="25" fill="#1769e0"/>
<text x="182" y="270" text-anchor="middle" class="num">1</text>
<text x="222" y="270" class="h">Immediate assessment</text>
<text x="172" y="312" class="p">• ABCDE and vital signs</text>
<text x="172" y="348" class="p">• 12-lead ECG promptly if ACS is possible</text>
<text x="172" y="384" class="p">• Identify shock, hypoxemia or ongoing severe pain</text><line x1="600" y1="370" x2="600" y2="425" stroke="#7aa0c7" stroke-width="5"/><polygon points="590,407 610,407 600,425" fill="#7aa0c7"/><rect x="140" y="430" width="920" height="190" rx="24" fill="#fff7f7" stroke="#ffd7da" stroke-width="2"/>
<circle cx="182" cy="472" r="25" fill="#d9363e"/>
<text x="182" y="480" text-anchor="middle" class="num">2</text>
<text x="222" y="480" class="h">Look for time-critical causes</text>
<text x="172" y="522" class="p">• ACS</text>
<text x="172" y="558" class="p">• Aortic dissection</text>
<text x="172" y="594" class="p">• Pulmonary embolism</text>
<text x="172" y="630" class="p">• Tension pneumothorax / tamponade</text>
<text x="172" y="666" class="p">• Esophageal rupture</text><line x1="600" y1="620" x2="600" y2="675" stroke="#7aa0c7" stroke-width="5"/><polygon points="590,657 610,657 600,675" fill="#7aa0c7"/><rect x="140" y="680" width="920" height="165" rx="24" fill="#ffffff" stroke="#d8e4f4" stroke-width="2"/>
<circle cx="182" cy="722" r="25" fill="#1769e0"/>
<text x="182" y="730" text-anchor="middle" class="num">3</text>
<text x="222" y="730" class="h">Focused testing</text>
<text x="172" y="772" class="p">• Serial high-sensitivity troponin when appropriate</text>
<text x="172" y="808" class="p">• Repeat ECG if symptoms persist</text>
<text x="172" y="844" class="p">• Use CXR / CTA / echo / PE work-up according to the pattern</text><line x1="600" y1="845" x2="600" y2="900" stroke="#7aa0c7" stroke-width="5"/><polygon points="590,882 610,882 600,900" fill="#7aa0c7"/><rect x="140" y="905" width="920" height="185" rx="24" fill="#f2fbf6" stroke="#d6efdf" stroke-width="2"/>
<circle cx="182" cy="947" r="25" fill="#138a54"/>
<text x="182" y="955" text-anchor="middle" class="num">4</text>
<text x="222" y="955" class="h">Disposition</text>
<text x="172" y="997" class="p">• STEMI → immediate reperfusion pathway</text>
<text x="172" y="1033" class="p">• High-risk NSTE-ACS → monitored admission / invasive strategy</text>
<text x="172" y="1069" class="p">• Alternative life-threatening diagnosis → treat cause urgently</text>
<text x="172" y="1105" class="p">• Low-risk pathway only after appropriate risk assessment</text><rect x="140" y="1140" width="920" height="180" rx="24" fill="#fff8e8" stroke="#ffe6b0" stroke-width="2"/>
<text x="168" y="1190" class="h">Clinical red flags</text>
<text x="172" y="1232" class="p">• Abrupt maximal pain + pulse/BP difference → consider dissection</text>
<text x="172" y="1268" class="p">• Pleuritic pain + VTE risk → consider PE</text>
<text x="172" y="1304" class="p">• Unilateral absent breath sounds + shock → treat tension pneumothorax</text>
<text x="172" y="1340" class="p">• Normal first ECG/troponin does not automatically exclude ACS</text>
</svg>