<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1380" viewBox="0 0 1200 1380"><defs><style>.title{font:700 52px Arial;fill:#102033}.sub{font:400 24px Arial;fill:#52677f}.h{font:700 26px Arial;fill:#102033}.p{font:400 20px Arial;fill:#243752}.small{font:400 17px Arial;fill:#52677f}</style></defs><rect width="100%" height="100%" fill="#f7f9fc"/><rect x="40" y="35" width="1120" height="135" rx="28" fill="#eaf3ff"/><text x="70" y="98" class="title">ECG &amp; Troponin Quick Map</text><text x="70" y="140" class="sub">Core localization and biomarker principles</text><rect x="60" y="220" width="528.0" height="980" rx="26" fill="#edf4ff" stroke="#d4e5ff" stroke-width="2"/><text x="84" y="275" class="h">ECG Territories</text><text x="84" y="325" class="h">Inferior</text><text x="84" y="357" class="p">II, III, aVF</text><text x="84" y="412" class="h">Anterior</text><text x="84" y="444" class="p">V1–V4</text><text x="84" y="499" class="h">Lateral</text><text x="84" y="531" class="p">I, aVL, V5–V6</text><text x="84" y="586" class="h">Posterior clue</text><text x="84" y="618" class="p">ST depression V1–V3 with tall R waves; posterior</text><text x="84" y="645" class="p">leads may confirm.</text><rect x="612.0" y="220" width="528.0" height="980" rx="26" fill="#fff1f2" stroke="#ffd7da" stroke-width="2"/><text x="636.0" y="275" class="h">Troponin</text><text x="636.0" y="325" class="h">Elevated value</text><text x="636.0" y="357" class="p">Indicates myocardial injury, not automatically</text><text x="636.0" y="384" class="p">type 1 MI.</text><text x="636.0" y="439" class="h">Acute injury</text><text x="636.0" y="471" class="p">Dynamic rise and/or fall supports acute injury.</text><text x="636.0" y="526" class="h">MI diagnosis</text><text x="636.0" y="558" class="p">Requires injury plus clinical evidence of</text><text x="636.0" y="585" class="p">ischemia.</text><text x="636.0" y="640" class="h">Serial testing</text><text x="636.0" y="672" class="p">Use validated assay-specific pathways when ACS</text><text x="636.0" y="699" class="p">remains possible.</text><rect x="60" y="1230" width="1080" height="95" rx="22" fill="#ffffff" stroke="#d8e4f4" stroke-width="2"/><text x="85" y="1285" class="h">Use these visuals as rapid review; clinical decisions still depend on the full presentation and current guideline.</text></svg>