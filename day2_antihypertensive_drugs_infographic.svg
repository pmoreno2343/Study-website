<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1380" viewBox="0 0 1200 1380"><defs><style>.title{font:700 52px Arial;fill:#102033}.sub{font:400 24px Arial;fill:#52677f}.h{font:700 26px Arial;fill:#102033}.p{font:400 20px Arial;fill:#243752}.small{font:400 17px Arial;fill:#52677f}</style></defs><rect width="100%" height="100%" fill="#f7f9fc"/><rect x="40" y="35" width="1120" height="135" rx="28" fill="#eaf3ff"/><text x="70" y="98" class="title">Antihypertensive Drug Map</text><text x="70" y="140" class="sub">First-line classes, useful indications and common adverse effects</text><rect x="60" y="220" width="252.0" height="980" rx="26" fill="#edf4ff" stroke="#d4e5ff" stroke-width="2"/><text x="84" y="275" class="h">ACEi / ARB</text><text x="84" y="325" class="h">Useful</text><text x="84" y="357" class="p">Albuminuric CKD and selected CAD/HF</text><text x="84" y="384" class="p">contexts.</text><text x="84" y="439" class="h">Watch</text><text x="84" y="471" class="p">Potassium and renal function.</text><text x="84" y="526" class="h">Adverse effects</text><text x="84" y="558" class="p">ACEi cough / angioedema; both can</text><text x="84" y="585" class="p">cause hyperkalemia.</text><text x="84" y="640" class="h">Avoid</text><text x="84" y="672" class="p">Pregnancy; avoid routine ACEi + ARB</text><text x="84" y="699" class="p">combination.</text><rect x="336.0" y="220" width="252.0" height="980" rx="26" fill="#fff1f2" stroke="#ffd7da" stroke-width="2"/><text x="360.0" y="275" class="h">DHP CCB</text><text x="360.0" y="325" class="h">Example</text><text x="360.0" y="357" class="p">Amlodipine.</text><text x="360.0" y="412" class="h">Useful</text><text x="360.0" y="444" class="p">Effective BP lowering, including</text><text x="360.0" y="471" class="p">older adults.</text><text x="360.0" y="526" class="h">Adverse effects</text><text x="360.0" y="558" class="p">Ankle edema, flushing, headache.</text><rect x="612.0" y="220" width="252.0" height="980" rx="26" fill="#effaf4" stroke="#d6efdf" stroke-width="2"/><text x="636.0" y="275" class="h">Thiazide-like</text><text x="636.0" y="325" class="h">Useful</text><text x="636.0" y="357" class="p">Strong first-line outcome data.</text><text x="636.0" y="412" class="h">Adverse effects</text><text x="636.0" y="444" class="p">Hyponatremia, hypokalemia,</text><text x="636.0" y="471" class="p">hyperuricemia.</text><rect x="888.0" y="220" width="252.0" height="980" rx="26" fill="#fff8e8" stroke="#ffe6b0" stroke-width="2"/><text x="912.0" y="275" class="h">Beta Blocker</text><text x="912.0" y="325" class="h">Use when</text><text x="912.0" y="357" class="p">Prior MI, angina, HFrEF or</text><text x="912.0" y="384" class="p">rate-control indication.</text><text x="912.0" y="439" class="h">Caution</text><text x="912.0" y="471" class="p">Bradycardia, fatigue and</text><text x="912.0" y="498" class="p">bronchospasm risk depending on</text><text x="912.0" y="525" class="p">agent.</text><rect x="60" y="1230" width="1080" height="95" rx="22" fill="#ffffff" stroke="#d8e4f4" stroke-width="2"/><text x="85" y="1285" class="h">Use these visuals as rapid review; clinical decisions still depend on the full presentation and current guideline.</text></svg>