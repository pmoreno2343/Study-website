<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1380" viewBox="0 0 1200 1380"><defs><style>.title{font:700 52px Arial;fill:#102033}.sub{font:400 24px Arial;fill:#52677f}.h{font:700 26px Arial;fill:#102033}.p{font:400 20px Arial;fill:#243752}.small{font:400 17px Arial;fill:#52677f}</style></defs><rect width="100%" height="100%" fill="#f7f9fc"/><rect x="40" y="35" width="1120" height="135" rx="28" fill="#eaf3ff"/><text x="70" y="98" class="title">Stable Angina vs Acute Coronary Syndrome</text><text x="70" y="140" class="sub">Pattern recognition at a glance</text><rect x="60" y="220" width="528.0" height="980" rx="26" fill="#edf4ff" stroke="#d4e5ff" stroke-width="2"/><text x="84" y="275" class="h">Stable Angina</text><text x="84" y="325" class="h">Pattern</text><text x="84" y="357" class="p">Predictable symptoms with a similar trigger and</text><text x="84" y="384" class="p">threshold.</text><text x="84" y="439" class="h">Trigger</text><text x="84" y="471" class="p">Usually exertion or emotional stress.</text><text x="84" y="526" class="h">Relief</text><text x="84" y="558" class="p">Typically settles with rest and/or nitrate.</text><text x="84" y="613" class="h">Troponin</text><text x="84" y="645" class="p">Normal; no myocardial necrosis.</text><rect x="612.0" y="220" width="528.0" height="980" rx="26" fill="#fff1f2" stroke="#ffd7da" stroke-width="2"/><text x="636.0" y="275" class="h">Acute Coronary Syndrome</text><text x="636.0" y="325" class="h">Pattern</text><text x="636.0" y="357" class="p">New, worsening, prolonged or rest symptoms.</text><text x="636.0" y="412" class="h">Unstable Angina</text><text x="636.0" y="444" class="p">Ischemic syndrome without biomarker evidence of</text><text x="636.0" y="471" class="p">infarction.</text><text x="636.0" y="526" class="h">NSTEMI</text><text x="636.0" y="558" class="p">Acute troponin rise/fall plus evidence of</text><text x="636.0" y="585" class="p">ischemia; no persistent ST elevation.</text><text x="636.0" y="640" class="h">STEMI</text><text x="636.0" y="672" class="p">Diagnostic ST-elevation pattern requiring</text><text x="636.0" y="699" class="p">immediate reperfusion pathway.</text><rect x="60" y="1230" width="1080" height="95" rx="22" fill="#ffffff" stroke="#d8e4f4" stroke-width="2"/><text x="85" y="1285" class="h">Use these visuals as rapid review; clinical decisions still depend on the full presentation and current guideline.</text></svg>