<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1220" viewBox="0 0 1200 1220">
<defs>
<style>
.title{font:700 54px Arial,Helvetica,sans-serif;fill:#102033}
.sub{font:400 24px Arial,Helvetica,sans-serif;fill:#52677f}
.h{font:700 28px Arial,Helvetica,sans-serif;fill:#102033}
.p{font:400 22px Arial,Helvetica,sans-serif;fill:#243752}
.small{font:400 18px Arial,Helvetica,sans-serif;fill:#52677f}
.num{font:700 24px Arial,Helvetica,sans-serif;fill:white}
</style>
</defs>
<rect width="100%" height="100%" fill="#f7f9fc"/>
<rect x="40" y="35" width="1120" height="135" rx="28" fill="#eaf3ff"/>
<text x="70" y="98" class="title">Acute Coronary Syndrome</text>
<text x="70" y="140" class="sub">Recognition, early treatment and reperfusion strategy</text>
<rect x="140" y="220" width="920" height="145" rx="24" fill="#ffffff" stroke="#d8e4f4" stroke-width="2"/>
<circle cx="182" cy="262" r="25" fill="#1769e0"/>
<text x="182" y="270" text-anchor="middle" class="num">1</text>
<text x="222" y="270" class="h">Suspected ACS</text>
<text x="172" y="312" class="p">• Ischemic symptoms or anginal equivalent</text>
<text x="172" y="348" class="p">• ECG + monitoring + IV access + hs-troponin</text><line x1="600" y1="365" x2="600" y2="420" stroke="#7aa0c7" stroke-width="5"/><polygon points="590,402 610,402 600,420" fill="#7aa0c7"/><rect x="140" y="425" width="920" height="155" rx="24" fill="#f6f0ff" stroke="#e6d8ff" stroke-width="2"/>
<circle cx="182" cy="467" r="25" fill="#6e3ac4"/>
<text x="182" y="475" text-anchor="middle" class="num">2</text>
<text x="222" y="475" class="h">Persistent diagnostic ST elevation?</text>
<text x="172" y="517" class="p">• YES → STEMI pathway</text>
<text x="172" y="553" class="p">• NO → serial hs-troponin + repeat ECG + risk assessment</text><line x1="600" y1="580" x2="600" y2="635" stroke="#7aa0c7" stroke-width="5"/><polygon points="590,617 610,617 600,635" fill="#7aa0c7"/><rect x="85" y="640" width="500" height="255" rx="24" fill="#fff1f2" stroke="#ffd7da" stroke-width="2"/>
<circle cx="127" cy="682" r="25" fill="#d9363e"/>
<text x="127" y="690" text-anchor="middle" class="num">3A</text>
<text x="167" y="690" class="h">STEMI</text>
<text x="117" y="732" class="p">• Do not wait for troponin</text>
<text x="117" y="768" class="p">• Aspirin unless contraindicated</text>
<text x="117" y="804" class="p">• High-intensity statin</text>
<text x="117" y="840" class="p">• Primary PCI preferred when timely</text>
<text x="117" y="876" class="p">• If timely PCI is not possible, consider fibrinolysis when eligible</text><rect x="615" y="640" width="500" height="255" rx="24" fill="#edf4ff" stroke="#d4e5ff" stroke-width="2"/>
<circle cx="657" cy="682" r="25" fill="#1769e0"/>
<text x="657" y="690" text-anchor="middle" class="num">3B</text>
<text x="697" y="690" class="h">NSTE-ACS</text>
<text x="647" y="732" class="p">• Serial hs-troponin distinguishes NSTEMI from unstable angina</text>
<text x="647" y="768" class="p">• Antiplatelet / anticoagulation strategy according to pathway</text>
<text x="647" y="804" class="p">• High-risk features favor early invasive evaluation</text>
<text x="647" y="840" class="p">• Treat recurrent ischemia or instability urgently</text><line x1="600" y1="895" x2="600" y2="950" stroke="#7aa0c7" stroke-width="5"/><polygon points="590,932 610,932 600,950" fill="#7aa0c7"/><rect x="140" y="955" width="920" height="190" rx="24" fill="#fff8e8" stroke="#ffe6b0" stroke-width="2"/>
<circle cx="182" cy="997" r="25" fill="#b96c00"/>
<text x="182" y="1005" text-anchor="middle" class="num">4</text>
<text x="222" y="1005" class="h">Important cautions</text>
<text x="172" y="1047" class="p">• Oxygen for hypoxemia or respiratory distress, not routinely in normoxia</text>
<text x="172" y="1083" class="p">• Avoid nitrates in hypotension, suspected RV infarction or recent PDE-5 inhibitor use</text>
<text x="172" y="1119" class="p">• Consider aortic dissection before antithrombotics when presentation is classic</text>
</svg>