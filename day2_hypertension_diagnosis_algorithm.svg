<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1400" viewBox="0 0 1200 1400">
<defs>
<style>
.title{font:700 54px Arial,Helvetica,sans-serif;fill:#102033}
.sub{font:400 24px Arial,Helvetica,sans-serif;fill:#52677f}
.h{font:700 28px Arial,Helvetica,sans-serif;fill:#102033}
.p{font:400 22px Arial,Helvetica,sans-serif;fill:#243752}
.small{font:400 18px Arial,Helvetica,sans-serif;fill:#52677f}
.num{font:700 24px Arial,Helvetica,sans-serif;fill:white}
</style>
</defs>
<rect width="100%" height="100%" fill="#f7f9fc"/>
<rect x="40" y="35" width="1120" height="135" rx="28" fill="#eaf3ff"/>
<text x="70" y="98" class="title">Hypertension Diagnosis</text>
<text x="70" y="140" class="sub">Confirm the diagnosis before long-term treatment</text>
<rect x="140" y="220" width="920" height="155" rx="24" fill="#ffffff" stroke="#d8e4f4" stroke-width="2"/>
<circle cx="182" cy="262" r="25" fill="#1769e0"/>
<text x="182" y="270" text-anchor="middle" class="num">1</text>
<text x="222" y="270" class="h">Accurate office measurement</text>
<text x="172" y="312" class="p">• Correct cuff size</text>
<text x="172" y="348" class="p">• Seated rest, back supported, feet on floor</text>
<text x="172" y="384" class="p">• Repeat measurements and average</text><line x1="600" y1="375" x2="600" y2="430" stroke="#7aa0c7" stroke-width="5"/><polygon points="590,412 610,412 600,430" fill="#7aa0c7"/><rect x="140" y="435" width="920" height="170" rx="24" fill="#ffffff" stroke="#d8e4f4" stroke-width="2"/>
<circle cx="182" cy="477" r="25" fill="#1769e0"/>
<text x="182" y="485" text-anchor="middle" class="num">2</text>
<text x="222" y="485" class="h">Elevated reading</text>
<text x="172" y="527" class="p">• Review prior readings</text>
<text x="172" y="563" class="p">• Check medications, substances, pain and measurement technique</text>
<text x="172" y="599" class="p">• One reading usually does not establish chronic hypertension</text><line x1="600" y1="605" x2="600" y2="660" stroke="#7aa0c7" stroke-width="5"/><polygon points="590,642 610,642 600,660" fill="#7aa0c7"/><rect x="140" y="665" width="920" height="170" rx="24" fill="#f2fbf6" stroke="#d6efdf" stroke-width="2"/>
<circle cx="182" cy="707" r="25" fill="#138a54"/>
<text x="182" y="715" text-anchor="middle" class="num">3</text>
<text x="222" y="715" class="h">Confirm when feasible</text>
<text x="172" y="757" class="p">• Home BP monitoring or ambulatory BP monitoring</text>
<text x="172" y="793" class="p">• Identify white-coat and masked hypertension</text><line x1="600" y1="835" x2="600" y2="890" stroke="#7aa0c7" stroke-width="5"/><polygon points="590,872 610,872 600,890" fill="#7aa0c7"/><rect x="140" y="895" width="920" height="200" rx="24" fill="#ffffff" stroke="#d8e4f4" stroke-width="2"/>
<circle cx="182" cy="937" r="25" fill="#1769e0"/>
<text x="182" y="945" text-anchor="middle" class="num">4</text>
<text x="222" y="945" class="h">Assess overall risk</text>
<text x="172" y="987" class="p">• ASCVD risk and comorbid disease</text>
<text x="172" y="1023" class="p">• Kidney function, electrolytes and albuminuria when appropriate</text>
<text x="172" y="1059" class="p">• ECG / target-organ effects</text>
<text x="172" y="1095" class="p">• Secondary-cause clues: abrupt onset, resistant/severe HTN, hypokalemia, young age</text><line x1="600" y1="1095" x2="600" y2="1150" stroke="#7aa0c7" stroke-width="5"/><polygon points="590,1132 610,1132 600,1150" fill="#7aa0c7"/><rect x="140" y="1155" width="920" height="175" rx="24" fill="#f6f0ff" stroke="#e6d8ff" stroke-width="2"/>
<circle cx="182" cy="1197" r="25" fill="#6e3ac4"/>
<text x="182" y="1205" text-anchor="middle" class="num">5</text>
<text x="222" y="1205" class="h">Treat</text>
<text x="172" y="1247" class="p">• Lifestyle intervention for all</text>
<text x="172" y="1283" class="p">• Pharmacotherapy according to BP level, cardiovascular risk and comorbidities</text>
<text x="172" y="1319" class="p">• Reassess adherence and home/office BP response</text>
</svg>